[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI foundation for Prelegal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "Markdown>=3.7,<4.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prelegal_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
